[settings]
; Base URL for the parted zip folders (img_pack/ and aud_pack/)
; Leave empty to load from the project root (local)
baseUrl=
; https://raw.githubusercontent.com/CaveGameDev/O-Launcher/assets 
; Set to true to fetch parted zips from baseUrl, false for local
useRemoteParts=false
; NEW BELOW
accountId=

; How many part downloads may run at once (1-16). 6-8 is a good default;
; raise it on fast links, lower it on weak servers.
concurrency=6

; Persist combined archives in IndexedDB so repeat boots skip the ~1.5 GB
; download. Set false to always re-download.
cacheEnabled=false
