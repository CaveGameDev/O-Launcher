[settings]
; Single remote origin for EVERYTHING the game loads: the main zips
; (data.zip, maps.zip, languages.zip), the parted image/audio packs
; (img_pack/, aud_pack/), all js (plugins + libs), movies/ and fonts/.
; The hosted site itself only needs index.html, base.ini and game.js.
; Leave empty to serve every asset from the local folder instead.
baseUrl=https://cdn.jsdelivr.net/gh/CaveGameDev/O-Launcher@refs/heads/experimentin/
; https://raw.githubusercontent.com/CaveGameDev/O-Launcher/assets
; Set to true to append the pack folders (img_pack/, aud_pack/) to baseUrl;
; false fetches archives straight from the baseUrl root / locally.
useRemoteParts=true
; NEW BELOW
accountId=

; How many part downloads may run at once (1-16). 6-8 is a good default;
; raise it on fast links, lower it on weak servers.
concurrency=6

; Persist combined archives in IndexedDB so repeat boots skip the ~1.5 GB
; download. Set false to always re-download.
cacheEnabled=true
