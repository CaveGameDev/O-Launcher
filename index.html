    <script>
        (function() {
            'use strict';
            
            function stripSdcardPath(path) {
                if (!path || typeof path !== 'string') return path;
                const prefix = '/sdcard/OMORI/';
                if (path.startsWith(prefix)) return path.substring(prefix.length);
                if (path.startsWith('sdcard/OMORI/')) return path.substring(13);
                return path;
            }
            
            window.stripSdcardPath = stripSdcardPath;
            
            const origXHROpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
                if (typeof url === 'string') {
                    url = stripSdcardPath(url);
                }
                return origXHROpen.call(this, method, url, async !== false, user, password);
            };
        })();
    </script>

    <script>
        (function() {
            'use strict';
            var DB_NAME = 'WO_Client';
            var STORE = 'files';
            var dbPromise = null;
            function openDb() {
                if (dbPromise) return dbPromise;
                if (typeof indexedDB === 'undefined') {
                    dbPromise = Promise.reject(new Error('indexedDB unavailable'));
                    return dbPromise;
                }
                dbPromise = new Promise(function(resolve, reject) {
                    var req = indexedDB.open(DB_NAME, 1);
                    req.onupgradeneeded = function(e) {
                        var db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE)) {
                            db.createObjectStore(STORE, { keyPath: 'path' });
                        }
                    };
                    req.onsuccess = function(e) { resolve(e.target.result); };
                    req.onerror = function(e) { reject(e.target.error); };
                });
                return dbPromise;
            }
            function put(path, data) {
                openDb().then(function(db) {
                    return new Promise(function(resolve, reject) {
                        var tx = db.transaction(STORE, 'readwrite');
                        tx.objectStore(STORE).put({ path: path, data: data });
                        tx.oncomplete = resolve;
                        tx.onerror = function() { reject(tx.error); };
                    });
                }).catch(function() {});
            }
            function remove(path) {
                openDb().then(function(db) {
                    return new Promise(function(resolve, reject) {
                        var tx = db.transaction(STORE, 'readwrite');
                        tx.objectStore(STORE).delete(path);
                        tx.oncomplete = resolve;
                        tx.onerror = function() { reject(tx.error); };
                    });
                }).catch(function() {});
            }
            function loadAll() {
                return openDb().then(function(db) {
                    return new Promise(function(resolve, reject) {
                        var tx = db.transaction(STORE, 'readonly');
                        var req = tx.objectStore(STORE).getAll();
                        req.onsuccess = function() { resolve(req.result || []); };
                        req.onerror = function() { reject(req.error); };
                    });
                }).catch(function() { return []; });
            }
            window.WOClient = { DB_NAME: DB_NAME, put: put, remove: remove, loadAll: loadAll };
            // Hydrate the fs polyfill's memoryFS from IndexedDB before boot.
            // (Boot is gated behind the LAUNCH button, so this has time to land.)
            loadAll().then(function(entries) {
                if (window.__memoryFS) {
                    (entries || []).forEach(function(e) { window.__memoryFS[e.path] = e.data; });
                }
            });
        })();
    </script>

    <!-- ============================================================ -->
    <!-- 6.5B ZIP LOADING PROGRESS BAR -->
    <!-- ============================================================ -->
    <div id="zipProgress" style="
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.92); z-index: 2147483646;
        font-family: 'GameFont', monospace; color: #fff;
    ">
        <div style="font-size: 16px; margin-bottom: 16px; letter-spacing: 2px; color: #ccc;">LOADING ASSETS</div>
        <div style="width: 340px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; border: 1px solid #444;">
            <div id="zipProgressFill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #6a5acd, #b19cd9); border-radius: 3px; transition: width 0.3s ease;"></div>
        </div>
        <div id="zipProgressLabel" style="font-size: 12px; margin-top: 10px; color: #888;">Initializing...</div>
        <button id="zipLaunchButton" type="button" style="
            display: none; margin-top: 24px; padding: 11px 34px;
            border: 1px solid rgba(210,190,255,0.8); border-radius: 5px;
            background: linear-gradient(180deg, #8d78e8, #5e4ab4);
            box-shadow: 0 4px 18px rgba(105,82,205,0.35), inset 0 1px rgba(255,255,255,0.25);
            color: #fff; font: inherit; font-size: 13px; letter-spacing: 2px;
            cursor: pointer; transition: transform .15s ease, filter .15s ease;
        ">LAUNCH</button>
    </div>

    <!-- ============================================================ -->
    <!-- 6.6 SAVE FILE UPLOAD TOOL -->
    <!-- ============================================================ -->
    <div id="saveUploader" style="position: fixed; top: 5px; right: 5px; z-index: 2147483647; pointer-events: auto; background: rgba(0,0,0,0.85); padding: 6px 10px; border-radius: 4px; font-family: monospace; font-size: 11px; border: 1px solid rgba(255,255,255,0.2);">
        <label for="saveFileInput" style="color: #ccc; cursor: pointer; margin-right: 6px;">📂 Upload .rpgsave</label>
        <input type="file" id="saveFileInput" accept=".rpgsave" multiple style="display: none;" onchange="handleSaveUpload(event)">
        <span id="saveUploadStatus" style="color: #5f5; font-size: 10px;"></span>
        <br>
        <button type="button" id="exportSavesButton" style="margin-top: 6px; background: rgba(255,255,255,0.12); color: #ccc; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px; padding: 3px 8px; font: inherit; font-size: 10px; cursor: pointer;" onclick="handleSaveExport(event)">💾 Export Saves</button>
    </div>
    <script>
        window._cachedTitleData = null;
        
        function handleSaveUpload(event) {
            var files = event.target.files;
            var loaded = 0;
            var statusEl = document.getElementById('saveUploadStatus');
            statusEl.textContent = 'Loading...';
            statusEl.style.color = '#ff0';
            
            for (var i = 0; i < files.length; i++) {
                (function(file) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var content = e.target.result;
                        var fileName = file.name;
                        // Determine save slot from filename (e.g., file1.rpgsave -> slot 1)
                        var slotMatch = fileName.match(/file(\d+)\.rpgsave/i);
                        var slotId = slotMatch ? parseInt(slotMatch[1]) : null;
                        
                        if (slotId && slotId >= 1 && slotId <= 20) {
                            // Inject into StorageManager web storage (expects LZString-compressed base64)
                            // Detect if already compressed; if not, compress
                            var key = 'RPG File' + slotId;
                            var isCompressed = /^[A-Za-z0-9+/=]+$/.test(content.trim()) && content.length > 50;
                            var storageData = isCompressed ? content : (typeof LZString !== 'undefined' ? LZString.compressToBase64(content) : content);
                            localStorage.setItem(key, storageData);
                            loaded++;
                        } else if (fileName.toLowerCase() === 'global.rpgsave') {
                            var isComp = /^[A-Za-z0-9+/=]+$/.test(content.trim()) && content.length > 50;
                            localStorage.setItem('RPG Global', isComp ? content : (typeof LZString !== 'undefined' ? LZString.compressToBase64(content) : content));
                            loaded++;
                        } else if (fileName.toLowerCase() === 'config.rpgsave') {
                            var isC = /^[A-Za-z0-9+/=]+$/.test(content.trim()) && content.length > 50;
                            localStorage.setItem('RPG Config', isC ? content : (typeof LZString !== 'undefined' ? LZString.compressToBase64(content) : content));
                            loaded++;
                        } else if (fileName.toLowerCase() === 'titledata') {
                            window._cachedTitleData = content.trim();
                            loaded++;
                        }
                        
                        if (loaded === files.length) {
                            statusEl.textContent = loaded + ' save(s) loaded! Refresh to apply.';
                            statusEl.style.color = '#5f5';
                        }
                    };
                    reader.readAsText(file);
                })(files[i]);
            }
            event.target.value = '';
        }
        
        function handleSaveExport(event) {
            var statusEl = document.getElementById('saveUploadStatus');
            statusEl.textContent = 'Zipping...';
            statusEl.style.color = '#ff0';
            setTimeout(function() {
                try {
                    var files = {};
                    // Slot files from web storage (LZString base64, exactly what .rpgsave expects)
                    for (var i = 1; i <= 20; i++) {
                        var slot = localStorage.getItem('RPG File' + i);
                        if (slot) { files['file' + i + '.rpgsave'] = slot; }
                    }
                    var g = localStorage.getItem('RPG Global');
                    if (g) { files['global.rpgsave'] = g; }
                    var c = localStorage.getItem('RPG Config');
                    if (c) { files['config.rpgsave'] = c; }
                    // TITLEDATA + any files written through the fs layer (WO_Client / memoryFS)
                    var ttd = window.__memoryFS && (window.__memoryFS['/TITLEDATA'] || window.__memoryFS['TITLEDATA']);
                    if (ttd) { files['TITLEDATA'] = ttd; }
                    if (window.__memoryFS) {
                        Object.keys(window.__memoryFS).forEach(function(k) {
                            if (/\.rpgsave$/.test(k) && !files[k]) { files[k] = window.__memoryFS[k]; }
                        });
                    }
                    var names = Object.keys(files);
                    if (names.length === 0) {
                        statusEl.textContent = 'No saves to export.';
                        statusEl.style.color = '#f88';
                        return;
                    }
                    if (typeof fflate !== 'undefined' && fflate.zipSync) {
                        // This fflate build recurses infinitely when given plain
                        // strings, so encode each save to UTF-8 bytes first.
                        var enc = new TextEncoder();
                        var byteFiles = {};
                        Object.keys(files).forEach(function(k) { byteFiles[k] = enc.encode(files[k]); });
                        var zipBytes = fflate.zipSync(byteFiles, { level: 0 });
                        var blob = new Blob([zipBytes], { type: 'application/zip' });
                        var a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = 'WO_Client_saves_' + new Date().toISOString().replace(/[:.]/g, '-') + '.zip';
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                    } else {
                        // Fallback: download each file individually
                        names.forEach(function(name) {
                            var b = new Blob([files[name]], { type: 'text/plain' });
                            var el = document.createElement('a');
                            el.href = URL.createObjectURL(b);
                            el.download = name;
                            document.body.appendChild(el);
                            el.click();
                            setTimeout(function() { URL.revokeObjectURL(el.href); el.remove(); }, 1000);
                        });
                    }
                    statusEl.textContent = names.length + ' save(s) exported!';
                    statusEl.style.color = '#5f5';
                } catch (e) {
                    statusEl.textContent = 'Export failed: ' + e.message;
                    statusEl.style.color = '#f88';
                }
            }, 10);
        }
    </script>
